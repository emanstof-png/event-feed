name: Raw fetch (no secrets)

# Plain-fetches every html / jsonld / rss row and commits the page text to raw_samples/ so
# Haiku scouts can extract events (briefs/SCOUT_EXTRACT.md) until ANTHROPIC_API_KEY exists.
on:
  workflow_dispatch:
    inputs:
      list:
        description: "Which source list: main (Sources tab) or elite (Elite Sources tab)"
        type: choice
        options: [main, elite]
        default: main

env:
  FEED_LIST: ${{ inputs.list || 'main' }}

permissions:
  contents: write

concurrency:
  group: rawfetch-${{ inputs.list || 'main' }}
  cancel-in-progress: true

jobs:
  rawfetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests curl_cffi beautifulsoup4 lxml icalendar recurring-ical-events feedparser anthropic tzdata
      - name: Fetch
        run: python raw_fetch.py
      - name: Commit samples
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_samples '*raw_fetch_log.csv' || true
          git commit -m "Raw fetch $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "No changes"; exit 0; }
          for i in 1 2 3 4; do git pull --rebase --autostash origin main && git push origin HEAD:main && break; echo "push retry $i"; sleep $((i*5)); done
