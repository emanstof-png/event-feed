name: Browser render test (no secrets)

# Renders every browser/stealth row with the stealth browser and commits the page text to
# browser_samples/ so Haiku scouts can check whether events are visible. No API key needed.
on:
  workflow_dispatch:
    inputs:
      list:
        description: "Which source list: main (Sources tab) or elite (Elite Sources tab)"
        type: choice
        options: [main, elite]
        default: main

env:
  FEED_LIST: ${{ inputs.list || 'main' }}

permissions:
  contents: write

concurrency:
  group: render-${{ inputs.list || 'main' }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml icalendar recurring-ical-events feedparser anthropic tzdata "scrapling[fetchers]==0.5"
          scrapling install
      - name: Render
        run: python render_test.py
      - name: Commit samples
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser_samples '*browser_render_log.csv' || true
          git commit -m "Browser render test $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "No changes"; exit 0; }
          git pull --rebase --autostash origin main
          git push origin HEAD:main
