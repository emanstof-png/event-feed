name: Probe sources

# Runs when the probe or the source list changes, or on demand from the
# Actions tab. Commits probe_report.* and probe_samples/ back to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - probe.py
      - sources.csv
      - requirements-probe.txt
      - .github/workflows/probe.yml

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-probe.txt
          python -m playwright install --with-deps chromium

      - name: Run probe
        run: python probe.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_report.csv probe_report.json probe_samples
          git commit -m "Probe report $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "No changes"; exit 0; }
          git pull --rebase --autostash origin main
          git push origin HEAD:main
