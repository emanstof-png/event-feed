name: Feed test (no secrets)

# Runs fetch.py in --csv mode on the feed-based methods only (ical, api, xhr, recurring):
# no Google key, no Haiku. Proves the structured readers end to end and commits
# feed_test.csv + run_log.csv so results are readable on GitHub.
on:
  workflow_dispatch:
    inputs:
      list:
        description: "Which source list: main (Sources tab) or elite (Elite Sources tab)"
        type: choice
        options: [main, elite]
        default: main
      methods:
        description: "Methods to run, comma-separated"
        type: string
        default: "ical,api,xhr,recurring"
      sources:
        description: "Sources file (prove_sources.csv to test candidate feeds before they go in the sheet)"
        type: string
        default: "sources_methods.csv"
      out:
        description: "Output suffix, e.g. _prove writes feed_test_prove.csv + run_log_prove.csv"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - sources_methods.csv
      - .github/workflows/feedtest.yml

env:
  FEED_LIST: ${{ inputs.list || 'main' }}

permissions:
  contents: write

concurrency:
  group: feedtest-${{ inputs.list || 'main' }}
  cancel-in-progress: true

jobs:
  feedtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (no browser)
        run: pip install requests curl_cffi beautifulsoup4 lxml icalendar recurring-ical-events feedparser anthropic tzdata

      - name: Run feed-based readers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch.py --csv --methods "${{ inputs.methods || 'ical,api,xhr,recurring' }}" --workers 6 --sources-csv "${{ inputs.sources || 'sources_methods.csv' }}" --out "${{ inputs.out }}"

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed_test*.csv feed_desc*.csv run_log*.csv debug || true
          git commit -m "Feed test $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "No changes"; exit 0; }
          git pull --rebase --autostash origin main
          git push origin HEAD:main
