name: Feed test (no secrets)

# Runs fetch.py in --csv mode on the feed-based methods only (ical, api, xhr, recurring):
# no Google key, no Haiku. Proves the structured readers end to end and commits
# feed_test.csv + run_log.csv so results are readable on GitHub.
on:
  workflow_dispatch:
    inputs:
      methods:
        description: "Methods to run, comma-separated"
        type: string
        default: "ical,api,xhr,recurring"
  push:
    branches: [main]
    paths:
      - sources_methods.csv
      - .github/workflows/feedtest.yml

permissions:
  contents: write

concurrency:
  group: feedtest
  cancel-in-progress: true

jobs:
  feedtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (no browser)
        run: pip install requests beautifulsoup4 lxml icalendar recurring-ical-events feedparser anthropic tzdata

      - name: Run feed-based readers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch.py --csv --methods "${{ inputs.methods || 'ical,api,xhr,recurring' }}" --workers 6

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed_test.csv run_log.csv debug || true
          git commit -m "Feed test $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "No changes"; exit 0; }
          git pull --rebase origin main
          git push origin HEAD:main
