name: Discover data calls (no secrets)

# SPEC_SPEED Phase 1: renders every browser/stealth row once, records the JSON/ics/XML calls
# its widget makes, replays each one without cookies, commits discover/ + discover_log.csv.
# About 30 sources x up to 60s = 15 to 30 min of GitHub time (no tokens).
on:
  workflow_dispatch:
    inputs:
      list:
        description: "Which source list: main (Sources tab) or elite (Elite Sources tab)"
        type: choice
        options: [main, elite]
        default: main
      names:
        description: "Optional: source names, separated by |"
        type: string
        default: ""

env:
  FEED_LIST: ${{ inputs.list || 'main' }}

permissions:
  contents: write

concurrency:
  group: discover-${{ inputs.list || 'main' }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install requests playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Discover
        run: |
          IFS='|' read -ra N <<< "${{ inputs.names }}"
          python discover.py "${N[@]}"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discover '*discover_log.csv' || true
          git commit -m "Discover $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "No changes"; exit 0; }
          git pull --rebase --autostash origin main
          git push origin HEAD:main
